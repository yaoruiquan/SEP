# Shared client-integration environment. Reuses the host PostgreSQL, Redis and
# Ollama services while keeping application data and credentials isolated.
x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: "3001"
  DATABASE_URL: postgresql://${SEP_DEV_DB_USER:?SEP_DEV_DB_USER is required}:${SEP_DEV_DB_PASSWORD:?SEP_DEV_DB_PASSWORD is required}@longdao-postgres:5432/sep_dev
  REDIS_URL: ${SEP_DEV_REDIS_URL:-redis://longdao-redis:6379/2}
  JWT_SECRET: ${SEP_DEV_JWT_SECRET:?SEP_DEV_JWT_SECRET is required}
  JWT_EXPIRE_DAYS: "7"
  SUB2API_BASE_URL: ${SUB2API_BASE_URL:-https://longdaoai.cn/v1}
  SUB2API_API_KEY: ${SUB2API_API_KEY:?SUB2API_API_KEY is required}
  SUB2API_DEFAULT_MODEL: ${SUB2API_DEFAULT_MODEL:-gemini-3.5-flash-high}
  SUB2API_PLANNER_MODEL: ${SUB2API_PLANNER_MODEL:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://sep-ollama:11434/v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3:latest}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-ollama-local}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-120000}
  UPLOAD_PATH: /app/uploads
  PACKAGE_STORAGE_PATH: /app/storage/packages
  API_BASE_URL: https://sep-dev.longdaoSEP.cn/api
  WEB_BASE_URL: https://sep-dev.longdaoSEP.cn
  FRONTEND_URL: https://sep-dev.longdaoSEP.cn
  ASSET_BASE_URL: ${ASSET_BASE_URL:-https://sep-dev.longdaoSEP.cn}
  CORS_ORIGIN: https://sep-dev.longdaoSEP.cn
  NEXT_PUBLIC_WS_URL: wss://sep-dev.longdaoSEP.cn
  ALIPAY_SANDBOX_MODE: "true"
  TZ: Asia/Shanghai

x-backend-defaults: &backend-defaults
  restart: unless-stopped
  mem_limit: 512m
  environment: *backend-environment
  volumes:
    - sep_dev_uploads:/app/uploads
    - sep_dev_packages:/app/storage/packages
  networks:
    - longdao-network
  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 3001 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

x-web-defaults: &web-defaults
  restart: unless-stopped
  mem_limit: 384m
  environment:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    TZ: Asia/Shanghai
  networks:
    - longdao-network
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  dev-migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: migrator
    image: sep-dev-migrator:${DEPLOY_TAG:-local}
    container_name: sep-dev-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${SEP_DEV_DB_USER:?SEP_DEV_DB_USER is required}:${SEP_DEV_DB_PASSWORD:?SEP_DEV_DB_PASSWORD is required}@longdao-postgres:5432/sep_dev
      TZ: Asia/Shanghai
    networks:
      - longdao-network
    # The shared PostgreSQL image does not include pgvector. Keep the migration
    # history compatible with the existing BYTEA fallback in this environment.
    command:
      - sh
      - -c
      - >-
        printf '%s\n' '-- pgvector is unavailable on the shared host image; the
        service uses the bounded BYTEA compatibility path.' >
        /app/backend/prisma/migrations/20260826100000_enable_pgvector/migration.sql
        && pnpm --filter backend exec prisma migrate deploy

  dev-backend:
    <<: *backend-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: sep-dev-backend:${DEPLOY_TAG:-local}
    container_name: sep-dev-backend
    depends_on:
      dev-migrate:
        condition: service_completed_successfully

  dev-web:
    <<: *web-defaults
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        API_ORIGIN: http://sep-dev-backend:3001
        NEXT_PUBLIC_WS_URL: wss://sep-dev.longdaoSEP.cn
    image: sep-dev-web:${DEPLOY_TAG:-local}
    container_name: sep-dev-web
    depends_on:
      dev-backend:
        condition: service_healthy

volumes:
  sep_dev_uploads:
    name: sep_dev_uploads
  sep_dev_packages:
    name: sep_dev_packages

networks:
  longdao-network:
    external: true
