# Shared client-integration environment. Reuses the host PostgreSQL, Redis and
# Ollama services while keeping application data and credentials isolated.
x-backend-environment: &backend-environment
  # 默认使用开发模式，允许开发环境使用 Console Mail 和兼容密钥；
  # 设置 SEP_DEV_NODE_ENV=production 时必须同时提供完整生产认证配置。
  NODE_ENV: ${SEP_DEV_NODE_ENV:-development}
  PORT: "3001"
  DATABASE_URL: postgresql://${SEP_DEV_DB_USER:?SEP_DEV_DB_USER is required}:${SEP_DEV_DB_PASSWORD:?SEP_DEV_DB_PASSWORD is required}@longdao-postgres:5432/sep_dev
  REDIS_URL: ${SEP_DEV_REDIS_URL:-redis://longdao-redis:6379/2}
  JWT_SECRET: ${SEP_DEV_JWT_SECRET:?SEP_DEV_JWT_SECRET is required}
  ACCESS_JWT_SECRET: ${SEP_DEV_ACCESS_JWT_SECRET:-}
  ACCESS_TOKEN_EXPIRES_IN: ${SEP_DEV_ACCESS_TOKEN_EXPIRES_IN:-15m}
  REFRESH_TOKEN_EXPIRES_IN: ${SEP_DEV_REFRESH_TOKEN_EXPIRES_IN:-7d}
  REFRESH_TOKEN_PEPPER: ${SEP_DEV_REFRESH_TOKEN_PEPPER:-}
  REFRESH_COOKIE_NAME: ${SEP_DEV_REFRESH_COOKIE_NAME:-sep_dev_refresh}
  JWT_EXPIRE_DAYS: "7"
  MAIL_ENABLED: ${SEP_DEV_MAIL_ENABLED:-false}
  MAIL_HOST: ${SEP_DEV_MAIL_HOST:-}
  MAIL_PORT: ${SEP_DEV_MAIL_PORT:-587}
  MAIL_SECURE: ${SEP_DEV_MAIL_SECURE:-false}
  MAIL_USER: ${SEP_DEV_MAIL_USER:-}
  MAIL_PASSWORD: ${SEP_DEV_MAIL_PASSWORD:-}
  MAIL_FROM: ${SEP_DEV_MAIL_FROM:-}
  MAIL_FROM_NAME: ${SEP_DEV_MAIL_FROM_NAME:-硅基人才平台}
  OAUTH_TRANSACTION_TTL_SECONDS: ${SEP_DEV_OAUTH_TRANSACTION_TTL_SECONDS:-300}
  WECHAT_OAUTH_ENABLED: ${SEP_DEV_WECHAT_OAUTH_ENABLED:-false}
  WECHAT_APP_ID: ${SEP_DEV_WECHAT_APP_ID:-}
  WECHAT_APP_SECRET: ${SEP_DEV_WECHAT_APP_SECRET:-}
  WECHAT_REDIRECT_URI: ${SEP_DEV_WECHAT_REDIRECT_URI:-http://localhost:3001/api/auth/oauth/wechat/callback}
  QQ_OAUTH_ENABLED: ${SEP_DEV_QQ_OAUTH_ENABLED:-false}
  QQ_APP_ID: ${SEP_DEV_QQ_APP_ID:-}
  QQ_APP_KEY: ${SEP_DEV_QQ_APP_KEY:-}
  QQ_REDIRECT_URI: ${SEP_DEV_QQ_REDIRECT_URI:-http://localhost:3001/api/auth/oauth/qq/callback}
  SUB2API_BASE_URL: ${SUB2API_BASE_URL:-https://longdaoai.cn/v1}
  SUB2API_API_KEY: ${SUB2API_API_KEY:?SUB2API_API_KEY is required}
  GATEWAY_MODEL_RATE_LIMIT: ${GATEWAY_MODEL_RATE_LIMIT:-60}
  GATEWAY_MODEL_RATE_WINDOW_MS: ${GATEWAY_MODEL_RATE_WINDOW_MS:-60000}
  SUB2API_DEFAULT_MODEL: ${SUB2API_DEFAULT_MODEL:-gemini-3.5-flash-high}
  SUB2API_PLANNER_MODEL: ${SUB2API_PLANNER_MODEL:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://sep-ollama:11434/v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3:latest}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-ollama-local}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-120000}
  UPLOAD_PATH: /app/uploads
  PACKAGE_STORAGE_PATH: /app/storage/packages
  API_BASE_URL: https://sep-dev.longdaoSEP.cn/api
  WEB_BASE_URL: https://sep-dev.longdaoSEP.cn
  FRONTEND_URL: https://sep-dev.longdaoSEP.cn
  ASSET_BASE_URL: ${ASSET_BASE_URL:-https://sep-dev.longdaoSEP.cn}
  CORS_ORIGIN: https://sep-dev.longdaoSEP.cn
  NEXT_PUBLIC_WS_URL: wss://sep-dev.longdaoSEP.cn
  ALIPAY_SANDBOX_MODE: "true"
  TZ: Asia/Shanghai

x-backend-defaults: &backend-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  mem_limit: 512m
  environment: *backend-environment
  volumes:
    - sep_dev_uploads:/app/uploads
    - sep_dev_packages:/app/storage/packages
  networks:
    - longdao-network
  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 3001 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

x-web-defaults: &web-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  mem_limit: 384m
  environment:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    TZ: Asia/Shanghai
  networks:
    - longdao-network
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  dev-migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: migrator
    image: sep-dev-migrator:${DEPLOY_TAG:-local}
    container_name: sep-dev-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${SEP_DEV_DB_USER:?SEP_DEV_DB_USER is required}:${SEP_DEV_DB_PASSWORD:?SEP_DEV_DB_PASSWORD is required}@longdao-postgres:5432/sep_dev
      TZ: Asia/Shanghai
    networks:
      - longdao-network
    # The shared PostgreSQL image does not include pgvector. Keep the migration
    # history compatible with the existing BYTEA fallback in this environment.
    command:
      - sh
      - -c
      - >-
        printf '%s\n' '-- pgvector is unavailable on the shared host image; the
        service uses the bounded BYTEA compatibility path.' >
        /app/backend/prisma/migrations/20260826100000_enable_pgvector/migration.sql
        && pnpm --filter backend exec prisma migrate deploy

  dev-backend:
    <<: *backend-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: sep-dev-backend:${DEPLOY_TAG:-local}
    container_name: sep-dev-backend
    depends_on:
      dev-migrate:
        condition: service_completed_successfully

  dev-web:
    <<: *web-defaults
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        API_ORIGIN: http://sep-dev-backend:3001
        NEXT_PUBLIC_WS_URL: wss://sep-dev.longdaoSEP.cn
    image: sep-dev-web:${DEPLOY_TAG:-local}
    container_name: sep-dev-web
    depends_on:
      dev-backend:
        condition: service_healthy

volumes:
  sep_dev_uploads:
    name: sep_dev_uploads
  sep_dev_packages:
    name: sep_dev_packages

networks:
  longdao-network:
    external: true
