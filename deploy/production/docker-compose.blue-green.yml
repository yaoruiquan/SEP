# Blue/green application pair for zero-downtime releases.
# PostgreSQL, Redis, uploads, and packages remain shared with the existing stack.

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: "3001"
  # 用 SEP 专属的低权角色，不要复用中转的超级用户：那个用户对中转的 sub2api 库
  # 有完全控制权，SEP 侧一次写错库名的迁移就能删掉中转的生产数据。
  # sep_app 是非超级用户，且已被撤销对 sub2api 库的 CONNECT 权限。
  DATABASE_URL: postgresql://${SEP_DB_USER:?SEP_DB_USER is required}:${SEP_DB_PASSWORD:?SEP_DB_PASSWORD is required}@longdao-postgres:5432/sep_prod
  REDIS_URL: ${REDIS_URL:-redis://longdao-redis:6379/1}
  JWT_SECRET: ${JWT_SECRET}
  # 认证中心生产配置：Access JWT 与 Refresh Token 必须使用独立密钥。
  ACCESS_JWT_SECRET: ${ACCESS_JWT_SECRET:?ACCESS_JWT_SECRET is required}
  ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
  REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
  REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}
  REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-__Host-sep_refresh}
  JWT_EXPIRE_DAYS: "7"
  # 生产环境必须启用真实 SMTP，具体字段由后端启动校验。
  MAIL_ENABLED: ${MAIL_ENABLED:?MAIL_ENABLED is required}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_SECURE: ${MAIL_SECURE:-false}
  MAIL_USER: ${MAIL_USER:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-硅基人才平台}
  # 国内第三方登录：未启用时可以留空；启用后由后端校验完整配置和 HTTPS 回调。
  OAUTH_TRANSACTION_TTL_SECONDS: ${OAUTH_TRANSACTION_TTL_SECONDS:-300}
  WECHAT_OAUTH_ENABLED: ${WECHAT_OAUTH_ENABLED:-false}
  WECHAT_APP_ID: ${WECHAT_APP_ID:-}
  WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
  WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-}
  QQ_OAUTH_ENABLED: ${QQ_OAUTH_ENABLED:-false}
  QQ_APP_ID: ${QQ_APP_ID:-}
  QQ_APP_KEY: ${QQ_APP_KEY:-}
  QQ_REDIRECT_URI: ${QQ_REDIRECT_URI:-}
  # 不要写死 longdao-sub2api-blue：中转是蓝绿部署，发布会把当前颜色停掉，写死即断。
  # 默认走公网域名（对色切换免疫，且有 Caddy 的健康检查兜底）。
  # 中转两色都声明了颜色中立别名 sub2api，两色容器都重建过之后也可改为
  # http://sub2api:8080/v1 走内网。
  SUB2API_BASE_URL: ${SUB2API_BASE_URL:-https://longdaoai.cn/v1}
  SUB2API_API_KEY: ${SUB2API_API_KEY}
  GATEWAY_MODEL_RATE_LIMIT: ${GATEWAY_MODEL_RATE_LIMIT:-60}
  GATEWAY_MODEL_RATE_WINDOW_MS: ${GATEWAY_MODEL_RATE_WINDOW_MS:-60000}
  GATEWAY_MEMBER_CONCURRENCY: ${GATEWAY_MEMBER_CONCURRENCY:-4}
  GATEWAY_ENTERPRISE_CONCURRENCY: ${GATEWAY_ENTERPRISE_CONCURRENCY:-32}
  GATEWAY_MEMBER_RPM: ${GATEWAY_MEMBER_RPM:-120}
  GATEWAY_ENTERPRISE_RPM: ${GATEWAY_ENTERPRISE_RPM:-600}
  GATEWAY_ENTERPRISE_TOKEN_BUDGET: ${GATEWAY_ENTERPRISE_TOKEN_BUDGET:-0}
  GATEWAY_DEFAULT_MAX_TOKENS: ${GATEWAY_DEFAULT_MAX_TOKENS:-4096}
  MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-32768}
  GATEWAY_HTTP_JSON_LIMIT: ${GATEWAY_HTTP_JSON_LIMIT:-4mb}
  GATEWAY_MAX_REQUEST_BYTES: ${GATEWAY_MAX_REQUEST_BYTES:-4194304}
  GATEWAY_JSON_MAX_BYTES: ${GATEWAY_JSON_MAX_BYTES:-8388608}
  GATEWAY_ERROR_MAX_BYTES: ${GATEWAY_ERROR_MAX_BYTES:-65536}
  GATEWAY_AUTH_TOKEN_MAX_BYTES: ${GATEWAY_AUTH_TOKEN_MAX_BYTES:-4096}
  GATEWAY_AUTH_FAILURE_TOKEN_LIMIT: ${GATEWAY_AUTH_FAILURE_TOKEN_LIMIT:-120}
  GATEWAY_AUTH_FAILURE_SOURCE_LIMIT: ${GATEWAY_AUTH_FAILURE_SOURCE_LIMIT:-1200}
  GATEWAY_AUTH_FAILURE_WINDOW_MS: ${GATEWAY_AUTH_FAILURE_WINDOW_MS:-60000}
  GATEWAY_STREAM_HEADER_TIMEOUT_MS: ${GATEWAY_STREAM_HEADER_TIMEOUT_MS:-120000}
  GATEWAY_STREAM_IDLE_TIMEOUT_MS: ${GATEWAY_STREAM_IDLE_TIMEOUT_MS:-120000}
  GATEWAY_STREAM_TOTAL_TIMEOUT_MS: ${GATEWAY_STREAM_TOTAL_TIMEOUT_MS:-600000}
  GATEWAY_NON_STREAM_TIMEOUT_MS: ${GATEWAY_NON_STREAM_TIMEOUT_MS:-120000}
  SEP_GATEWAY_DRAIN_GRACE_MS: ${SEP_GATEWAY_DRAIN_GRACE_MS:-30000}
  SEP_GATEWAY_DRAIN_TIMEOUT_MS: ${SEP_GATEWAY_DRAIN_TIMEOUT_MS:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://sep-ollama:11434}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3:sep-790764642607}
  EMBEDDING_MODEL_DIGEST: ${EMBEDDING_MODEL_DIGEST:-sha256:7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab}
  EMBEDDING_TOKENIZER: ${EMBEDDING_TOKENIZER:-BAAI/bge-m3@5617a9f61b028005a4858fdac845db406aefb181}
  EMBEDDING_TOKENIZER_PATH: ${EMBEDDING_TOKENIZER_PATH:-/app/tokenizers/bge-m3/5617a9f61b028005a4858fdac845db406aefb181}
  EMBEDDING_DISTANCE: ${EMBEDDING_DISTANCE:-cosine}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-ollama-local}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
  EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-120000}
  KNOWLEDGE_PRIVATE_PATH: /app/private/knowledge
  UPLOAD_PATH: /app/uploads
  UPLOAD_LOCAL_DIR: /app/uploads/chat
  PACKAGE_STORAGE_PATH: /app/storage/packages
  API_BASE_URL: https://longdaoSEP.cn/api
  WEB_BASE_URL: https://longdaoSEP.cn
  FRONTEND_URL: https://longdaoSEP.cn
  ASSET_BASE_URL: ${ASSET_BASE_URL:-https://longdaoSEP.cn}
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
  NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required}
  ALIPAY_SANDBOX_MODE: "false"
  TZ: Asia/Shanghai

x-backend-defaults: &backend-defaults
  restart: unless-stopped
  stop_grace_period: ${SEP_STOP_GRACE_SECONDS:-30}s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  # 这台机器与龙道 AI 中转、共享 postgres 同宿主。不设上限时 SEP 一旦内存泄漏会吃满
  # 整机内存，OOM killer 通常挑占用最大的进程杀 —— 很可能是中转或 postgres。
  mem_limit: 768m
  environment: *backend-environment
  volumes:
    - sep_uploads:/app/uploads
    - sep_packages:/app/storage/packages
    - ${KNOWLEDGE_TOKENIZERS_HOST_PATH:-../../.cache/tokenizers}:/app/tokenizers:ro
    - ${KNOWLEDGE_PRIVATE_HOST_PATH:-/opt/sep/knowledge}:/app/private/knowledge
  networks:
    - longdao-network
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

x-web-defaults: &web-defaults
  restart: unless-stopped
  stop_grace_period: ${SEP_STOP_GRACE_SECONDS:-30}s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  mem_limit: 512m
  environment: &web-environment
    NODE_ENV: production
    SEP_API_PROXY_TIMEOUT_MS: ${SEP_API_PROXY_TIMEOUT_MS:-180000}
    NEXT_TELEMETRY_DISABLED: "1"
    TZ: Asia/Shanghai
  networks:
    - longdao-network
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  blue-backend:
    <<: *backend-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: sep-blue-backend:${DEPLOY_TAG:-local}
    container_name: sep-blue-backend

  blue-web:
    <<: *web-defaults
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        API_ORIGIN: http://sep-blue-backend:3001
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    image: sep-blue-web:${DEPLOY_TAG:-local}
    container_name: sep-blue-web
    environment:
      <<: *web-environment
      API_ORIGIN: http://sep-blue-backend:3001
    depends_on:
      blue-backend:
        condition: service_healthy

  green-backend:
    <<: *backend-defaults
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: sep-green-backend:${DEPLOY_TAG:-local}
    container_name: sep-green-backend

  green-web:
    <<: *web-defaults
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        API_ORIGIN: http://sep-green-backend:3001
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    image: sep-green-web:${DEPLOY_TAG:-local}
    container_name: sep-green-web
    environment:
      <<: *web-environment
      API_ORIGIN: http://sep-green-backend:3001
    depends_on:
      green-backend:
        condition: service_healthy

volumes:
  sep_uploads:
    name: sep_uploads
    external: true
  sep_packages:
    name: sep_packages
    external: true

networks:
  longdao-network:
    external: true
