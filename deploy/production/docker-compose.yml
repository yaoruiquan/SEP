# ═══════════════════════════════════════════════════════════════════════════════
# SEP 硅基人才平台 - 生产部署配置
# ═══════════════════════════════════════════════════════════════════════════════
# 复用现有基础设施：
#   - longdao-postgres (PostgreSQL 18，新建数据库 sep_prod)
#   - longdao-redis (Redis 8，使用 DB 1)
#   - longdao-sub2api-blue (sub2api 服务)
#   - longdao-network (Docker 网络)
#
# 部署步骤：见 README.md
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ═════════════════════════════════════════════════════════════════════════════
  # SEP Migrate (prisma migrate deploy — 启动后自动退出，幂等)
  # ═════════════════════════════════════════════════════════════════════════════
  sep-migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: migrator
    image: sep-migrator:${DEPLOY_TAG:-local}
    container_name: sep-migrate
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${SEP_DB_USER}:${SEP_DB_PASSWORD}@longdao-postgres:5432/sep_prod
      - TZ=Asia/Shanghai
    networks:
      - longdao-network

  # ═════════════════════════════════════════════════════════════════════════════
  # SEP Backend (NestJS)
  # ═════════════════════════════════════════════════════════════════════════════
  sep-backend:
    build:
      context: ../..          # SEP 项目根目录
      dockerfile: backend/Dockerfile
    image: sep-backend:${DEPLOY_TAG:-local}
    container_name: sep-backend
    restart: unless-stopped
    stop_grace_period: ${SEP_STOP_GRACE_SECONDS:-30}s
    environment:
      - NODE_ENV=production
      - PORT=3001

      # 数据库：复用 longdao-postgres，独立数据库 sep_prod
      - DATABASE_URL=postgresql://${SEP_DB_USER}:${SEP_DB_PASSWORD}@longdao-postgres:5432/sep_prod

      # Redis：复用 longdao-redis，使用 DB 1（longdao 用 DB 0）
      # longdao-redis currently has no AUTH configured. Set REDIS_URL explicitly
      # in /opt/sep/.env if Redis authentication is enabled later.
      - REDIS_URL=${REDIS_URL:-redis://longdao-redis:6379/1}

      # JWT
      - JWT_SECRET=${JWT_SECRET}
      # 认证中心生产配置：Access JWT 与 Refresh Token 必须使用独立密钥。
      - ACCESS_JWT_SECRET=${ACCESS_JWT_SECRET:?ACCESS_JWT_SECRET is required}
      - ACCESS_TOKEN_EXPIRES_IN=${ACCESS_TOKEN_EXPIRES_IN:-15m}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN:-7d}
      - REFRESH_TOKEN_PEPPER=${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME:-__Host-sep_refresh}
      - JWT_EXPIRE_DAYS=7
      - CORS_ORIGIN=${CORS_ORIGIN}

      # 邮件：生产环境必须启用真实 SMTP，具体字段由后端启动校验。
      - MAIL_ENABLED=${MAIL_ENABLED:?MAIL_ENABLED is required}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SECURE=${MAIL_SECURE:-false}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-硅基人才平台}

      # 国内第三方登录：未启用时可以留空；启用后由后端校验完整配置和 HTTPS 回调。
      - OAUTH_TRANSACTION_TTL_SECONDS=${OAUTH_TRANSACTION_TTL_SECONDS:-300}
      - WECHAT_OAUTH_ENABLED=${WECHAT_OAUTH_ENABLED:-false}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:-}
      - WECHAT_REDIRECT_URI=${WECHAT_REDIRECT_URI:-}
      - QQ_OAUTH_ENABLED=${QQ_OAUTH_ENABLED:-false}
      - QQ_APP_ID=${QQ_APP_ID:-}
      - QQ_APP_KEY=${QQ_APP_KEY:-}
      - QQ_REDIRECT_URI=${QQ_REDIRECT_URI:-}

      # sub2api（已在 longdao-network 运行）
      #
      # ⚠️ 容器名写死成 -blue 是个隐患：中转若切到 green 或改名，这里会连不上，
      # 表现是「工作安排」报「任务规划模型暂时不可用」、对话无响应 —— 而其他页面
      # 完全正常，很难联想到中转。故做成可覆盖，默认仍是 blue。
      - SUB2API_BASE_URL=${SUB2API_BASE_URL:-http://longdao-sub2api-blue:8080/v1}
      - SUB2API_API_KEY=${SUB2API_API_KEY}
      - GATEWAY_MODEL_RATE_LIMIT=${GATEWAY_MODEL_RATE_LIMIT:-60}
      - GATEWAY_MODEL_RATE_WINDOW_MS=${GATEWAY_MODEL_RATE_WINDOW_MS:-60000}
      - GATEWAY_MEMBER_CONCURRENCY=${GATEWAY_MEMBER_CONCURRENCY:-4}
      - GATEWAY_ENTERPRISE_CONCURRENCY=${GATEWAY_ENTERPRISE_CONCURRENCY:-32}
      - GATEWAY_MEMBER_RPM=${GATEWAY_MEMBER_RPM:-120}
      - GATEWAY_ENTERPRISE_RPM=${GATEWAY_ENTERPRISE_RPM:-600}
      - GATEWAY_ENTERPRISE_TOKEN_BUDGET=${GATEWAY_ENTERPRISE_TOKEN_BUDGET:-0}
      - GATEWAY_DEFAULT_MAX_TOKENS=${GATEWAY_DEFAULT_MAX_TOKENS:-4096}
      - GATEWAY_HTTP_JSON_LIMIT=${GATEWAY_HTTP_JSON_LIMIT:-4mb}
      - GATEWAY_MAX_REQUEST_BYTES=${GATEWAY_MAX_REQUEST_BYTES:-4194304}
      - GATEWAY_JSON_MAX_BYTES=${GATEWAY_JSON_MAX_BYTES:-8388608}
      - GATEWAY_ERROR_MAX_BYTES=${GATEWAY_ERROR_MAX_BYTES:-65536}
      - GATEWAY_AUTH_TOKEN_MAX_BYTES=${GATEWAY_AUTH_TOKEN_MAX_BYTES:-4096}
      - GATEWAY_AUTH_FAILURE_TOKEN_LIMIT=${GATEWAY_AUTH_FAILURE_TOKEN_LIMIT:-120}
      - GATEWAY_AUTH_FAILURE_SOURCE_LIMIT=${GATEWAY_AUTH_FAILURE_SOURCE_LIMIT:-1200}
      - GATEWAY_AUTH_FAILURE_WINDOW_MS=${GATEWAY_AUTH_FAILURE_WINDOW_MS:-60000}
      - GATEWAY_STREAM_HEADER_TIMEOUT_MS=${GATEWAY_STREAM_HEADER_TIMEOUT_MS:-120000}
      - GATEWAY_STREAM_IDLE_TIMEOUT_MS=${GATEWAY_STREAM_IDLE_TIMEOUT_MS:-120000}
      - GATEWAY_STREAM_TOTAL_TIMEOUT_MS=${GATEWAY_STREAM_TOTAL_TIMEOUT_MS:-600000}
      - GATEWAY_NON_STREAM_TIMEOUT_MS=${GATEWAY_NON_STREAM_TIMEOUT_MS:-120000}
      - SEP_GATEWAY_DRAIN_GRACE_MS=${SEP_GATEWAY_DRAIN_GRACE_MS:-30000}
      - SEP_GATEWAY_DRAIN_TIMEOUT_MS=${SEP_GATEWAY_DRAIN_TIMEOUT_MS:-}
      # 必须显式钉住模型：不传时后端回落到代码常量 DEFAULT_MODEL_ID，
      # 换个默认值就要重新构建镜像才能改。中转实际提供哪些模型用
      # `curl -H "Authorization: Bearer $KEY" <base>/models` 确认，
      # 实测只有 gemini-* 系列，任何 gpt-* / claude-* 都会 404 model_not_found。
      - SUB2API_DEFAULT_MODEL=${SUB2API_DEFAULT_MODEL:-gemini-3.5-flash-high}
      # 任务编排规划器可单独指定（不设则跟随 SUB2API_DEFAULT_MODEL）
      - SUB2API_PLANNER_MODEL=${SUB2API_PLANNER_MODEL:-}

      # 知识库 Embedding：使用独立 Ollama 服务，禁止回退到容器内 localhost
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://sep-ollama:11434/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3:latest}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-ollama-local}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      - EMBEDDING_TIMEOUT_MS=${EMBEDDING_TIMEOUT_MS:-120000}

      # 文件上传
      - UPLOAD_PATH=/app/uploads
      - UPLOAD_LOCAL_DIR=/app/uploads/chat
      # 员工包 ZIP 文件必须落在持久化卷，容器重建时不能依赖容器文件系统
      - PACKAGE_STORAGE_PATH=/app/storage/packages

      # 支付宝回调地址（生产）
      - API_BASE_URL=https://longdaoSEP.cn/api
      - WEB_BASE_URL=https://longdaoSEP.cn
      - FRONTEND_URL=https://longdaoSEP.cn
      - ASSET_BASE_URL=${ASSET_BASE_URL:-https://longdaoSEP.cn}
      - ALIPAY_SANDBOX_MODE=false

      # 时区
      - TZ=Asia/Shanghai

    volumes:
      - sep_uploads:/app/uploads
      - sep_packages:/app/storage/packages

    depends_on:
      sep-migrate:
        condition: service_completed_successfully

    networks:
      - longdao-network

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ═════════════════════════════════════════════════════════════════════════════
  # SEP Frontend (Next.js)
  # ═════════════════════════════════════════════════════════════════════════════
  sep-web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        - API_ORIGIN=http://sep-backend:3001
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    image: sep-web:${DEPLOY_TAG:-local}
    container_name: sep-web
    restart: unless-stopped
    stop_grace_period: ${SEP_STOP_GRACE_SECONDS:-30}s
    environment:
      - NODE_ENV=production

      # Next.js rewrites /api/* → API_ORIGIN（见 next.config.mjs）
      - API_ORIGIN=http://sep-backend:3001
      - SEP_API_PROXY_TIMEOUT_MS=${SEP_API_PROXY_TIMEOUT_MS:-180000}

      - NEXT_TELEMETRY_DISABLED=1
      - TZ=Asia/Shanghai

    ports:
      - "3000:3000"    # Option A: 直接 IP 访问，无需 Caddy

    networks:
      - longdao-network

    depends_on:
      sep-backend:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

# ═══════════════════════════════════════════════════════════════════════════════
# 数据卷
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  sep_uploads:
    name: sep_uploads
    driver: local
  sep_packages:
    name: sep_packages
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
# 网络（外部，由 longdao docker-compose 创建）
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  longdao-network:
    external: true
