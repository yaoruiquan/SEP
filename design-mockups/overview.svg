<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#ffffff"/><text x="80" y="90" fill="#111111" font-family="Georgia" font-size="44" font-weight="bold">SEP 前端视觉方向 / 01</text><text x="82" y="130" fill="#718077" font-family="Arial" font-size="16">五个核心板块：登录、员工市场、对话工作台、贡献者中心、运营审核</text><rect x="80" y="190" width="680" height="350" rx="18" fill="#111111"/><text x="115" y="240" fill="#ffffff" font-family="Arial" font-size="15" font-weight="bold">A / 用户入口</text><text x="115" y="300" fill="#ffffff" font-family="Georgia" font-size="36" font-weight="bold">让数字员工，<tspan fill="#fff1ec">马上上岗。</tspan></text><rect x="115" y="360" width="270" height="86" rx="12" fill="#ffffff"/><text x="140" y="405" fill="#111111" font-family="Arial" font-size="16" font-weight="bold">欢迎回来</text><rect x="405" y="360" width="270" height="86" rx="12" fill="#eb3f00"/><text x="430" y="405" fill="white" font-family="Arial" font-size="16" font-weight="bold">登录 / 注册</text><rect x="840" y="190" width="680" height="350" rx="18" fill="#ffffff"/><text x="875" y="240" fill="#111111" font-family="Arial" font-size="15" font-weight="bold">B / 员工市场</text><text x="875" y="300" fill="#111111" font-family="Georgia" font-size="34" font-weight="bold">找到你的下一位同事</text><rect x="875" y="345" width="190" height="125" rx="13" fill="#fff1ec"/><text x="900" y="390" fill="#111111" font-family="Arial" font-size="16" font-weight="bold">电商运营</text><text x="900" y="425" fill="#5b4c43" font-family="Arial" font-size="13">¥199 / 月</text><rect x="1085" y="345" width="190" height="125" rx="13" fill="#f4f4f4"/><text x="1110" y="390" fill="#111111" font-family="Arial" font-size="16" font-weight="bold">内容策划</text><text x="1110" y="425" fill="#52635b" font-family="Arial" font-size="13">¥149 / 月</text><rect x="80" y="590" width="470" height="300" rx="18" fill="#f7f7f6"/><text x="115" y="640" fill="#111111" font-family="Arial" font-size="15" font-weight="bold">C / 对话工作台</text><rect x="115" y="680" width="100" height="155" rx="8" fill="#111111"/><rect x="235" y="680" width="270" height="155" rx="8" fill="#ffffff"/><text x="255" y="718" fill="#111111" font-family="Arial" font-size="14" font-weight="bold">手机壳上新</text><rect x="255" y="760" width="210" height="45" rx="8" fill="#f4f4f4"/><text x="275" y="788" fill="#52635b" font-family="Arial" font-size="12">调用：竞品分析</text><rect x="600" y="590" width="430" height="300" rx="18" fill="#f4f4f4"/><text x="635" y="640" fill="#111111" font-family="Arial" font-size="15" font-weight="bold">D / 贡献者中心</text><text x="635" y="700" fill="#111111" font-family="Arial" font-size="32" font-weight="bold">¥4,860</text><text x="635" y="735" fill="#52635b" font-family="Arial" font-size="14">本月收益</text><rect x="635" y="770" width="330" height="48" rx="8" fill="#ffffff"/><text x="660" y="800" fill="#111111" font-family="Arial" font-size="13" font-weight="bold">商品标题优化器 · 已通过</text><rect x="1080" y="590" width="440" height="300" rx="18" fill="#111111"/><text x="1115" y="640" fill="#ffffff" font-family="Arial" font-size="15" font-weight="bold">E / 运营审核后台</text><text x="1115" y="700" fill="#b8c8c6" font-family="Arial" font-size="14">待处理能力</text><text x="1115" y="760" fill="#fff" font-family="Arial" font-size="46" font-weight="bold">12</text><rect x="1260" y="720" width="190" height="48" rx="8" fill="#eb3f00"/><text x="1300" y="750" fill="white" font-family="Arial" font-size="13" font-weight="bold">进入审核队列</text><text x="80" y="950" fill="#718077" font-family="Arial" font-size="14">建议基调：工作台感、克制但有温度；主色深墨绿，操作强调珊瑚橙，状态使用植物绿和暖白。</text></svg>
