services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sep-postgres
    environment:
      POSTGRES_USER: sep
      POSTGRES_PASSWORD: sep_dev_password
      POSTGRES_DB: sep_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sep"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Embedding 使用独立部署的 Ollama 服务，不在本 Compose 中下载或运行模型。
  # 本地运行后端时使用 http://127.0.0.1:11434/v1；生产容器通过 Docker 网络使用
  # Ollama 服务名（例如 http://sep-ollama:11434/v1），并在运行环境注入 EMBEDDING_*。
  # 模型固定为 bge-m3:latest，返回维度必须为 1024。

  # NOTE: sub2api（大模型中转）与 Ollama（Embedding）都是外部独立服务，
  # 不由本 Compose 管理。本 Compose 只负责本地开发的 PostgreSQL + Redis。

volumes:
  postgres_data:
  redis_data:
