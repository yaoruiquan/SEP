name: Deploy to Production

on:
  push:
    branches: [main]

# 同一时间只跑一个部署，避免并发冲突
concurrency:
  group: production-deploy
  cancel-in-progress: false   # 不取消，排队等待

jobs:
  # ── 检测哪些部分有变化 ────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web:     ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pnpm-lock.yaml'
              - 'deploy/production/docker-compose.yml'
              - 'backend/Dockerfile'
            web:
              - 'web/**'
              - 'pnpm-lock.yaml'
              - 'deploy/production/docker-compose.yml'
              - 'web/Dockerfile'

  # ── 部署后端 ──────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH → deploy-backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/sep/app
            git pull origin main
            # 非交互模式：deploy-backend 不需要确认
            ./deploy/production/sep-deploy.sh deploy-backend

  # ── 部署前端（backend 成功或无需部署时才跑）────────────────────────────────
  deploy-web:
    name: Deploy web
    needs: [changes, deploy-backend]
    # backend 没变化时 deploy-backend 被跳过（result=skipped），这里仍然运行
    if: |
      always() &&
      needs.changes.outputs.web == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: SSH → deploy-web
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/sep/app
            git pull origin main
            ./deploy/production/sep-deploy.sh deploy-web
