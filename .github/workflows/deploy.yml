name: Deploy to Production

on:
  push:
    branches: [main]

# 同一时间只跑一个部署，避免并发冲突
concurrency:
  group: production-deploy
  cancel-in-progress: false   # 不取消，排队等待

jobs:
  # ── 检测哪些部分有变化 ────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      deploy:  ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deploy:
              - 'backend/**'
              - 'web/**'
              - 'pnpm-lock.yaml'
              - 'deploy/production/docker-compose.yml'
              - 'deploy/production/docker-compose.blue-green.yml'
              - 'deploy/production/sep-deploy.sh'
              - 'deploy/production/Caddyfile.blue-green.snippet'
              - 'backend/Dockerfile'
              - 'web/Dockerfile'

  # ── 前后端成对蓝绿部署 ─────────────────────────────────────────────────────
  deploy-bluegreen:
    name: Deploy blue/green pair
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH → 蓝绿部署前后端
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/sep/app
            git fetch origin main
            git merge --ff-only origin/main
            ./deploy/production/sep-deploy.sh deploy-bluegreen
            ./deploy/production/sep-deploy.sh status
