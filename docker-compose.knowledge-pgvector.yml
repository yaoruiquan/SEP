services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sep-knowledge-pgvector-postgres
    environment:
      POSTGRES_USER: sep
      POSTGRES_PASSWORD: sep_dev_password
      POSTGRES_DB: sep_platform
    ports:
      - "55432:5432"
    volumes:
      - knowledge_pgvector_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sep -d sep_platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: sep-knowledge-pgvector-redis
    ports:
      - "56379:6379"
    volumes:
      - knowledge_pgvector_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  knowledge_pgvector_postgres_data:
  knowledge_pgvector_redis_data:
